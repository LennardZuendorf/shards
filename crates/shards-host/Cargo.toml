[package]
name = "shards-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Host glue shared by the Shards desktop app and the browser-mode local server"
license = "MIT"
publish = false

[lib]
name = "shards_host"
path = "src/lib.rs"

[[bin]]
name = "shards-host"
path = "src/bin/shards-host.rs"

[dependencies]
shards = { path = "../.." }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
