[package]
name = "shards-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "MIT"

[dependencies]
shards = { path = "../.." }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
toml = "0.9"
rustix = { version = "1", features = ["fs", "process"] }
getrandom = "=0.4.3"
subtle = "=2.6.1"
url = "=2.5.8"
tempfile = "3"
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }

[dev-dependencies]
assert_cmd = "2"
tower = { version = "0.5", features = ["util"] }
