[workspace]
members = [".", "crates/shards-host", "apps/desktop/src-tauri"]
# A bare `cargo build/test/clippy/run` covers only the core (lib + `shards` CLI + stdio MCP).
# This keeps the CLI-first dev loop fast and keeps a bare `cargo build --release` /
# `cargo install --path .` free of tokio, axum and Tauri. Tauri also needs a built frontend
# (apps/desktop/dist) and, on Linux, webkit2gtk. Use `-p shards-host` / `-p shards-desktop`
# or `--workspace` for the rest. CI passes them explicitly (.github/workflows/ci.yml).
default-members = ["."]
resolver = "2"

[workspace.dependencies]
notify = "8"
notify-debouncer-full = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[package]
name = "shards"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
description = "Shards — the multiplayer task manager for humans and agents, backed by one Markdown folder"
license = "MIT"
publish = false

[lib]
name = "shards"
path = "src/lib.rs"

[[bin]]
name = "shards"
path = "src/main.rs"

[[bin]]
name = "shards-mcp"
path = "src/bin/shards-mcp.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.5"
crossterm = "0.29"
dirs = "6"
indexmap = { version = "2", features = ["serde"] }
notify = "8"
notify-debouncer-full = "0.6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
walkdir = "2"
which = "7"
yaml-rust2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
