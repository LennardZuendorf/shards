      <stop stop-color="#25282b" />
      <stop offset="1" stop-color="#151719" />
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)" />
  <rect x="65" y="65" width="894" height="894" rx="199" stroke="#ffffff" stroke-opacity=".1" stroke-width="2" />
  <g transform="translate(192 176) scale(6.4)">
    <polygon points="32,8 82,22 92,62 52,94 10,56" fill="#eff0f1" stroke="#eff0f1" stroke-width="9" stroke-linejoin="round" />
    <polygon points="32,8 82,22 92,62 54,52" fill="#a9afb4" stroke="#a9afb4" stroke-width="9" stroke-linejoin="round" />
