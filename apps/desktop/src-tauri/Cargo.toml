[package]
name = "shards-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "shards_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
shards-host = { path = "../../../crates/shards-host" }
# Pin the 2.x line explicitly: `cargo add tauri` resolves to 3.0.0-alpha.
tauri = { version = "~2.12", features = [] }
# Plugins: 2.x only (a caret on 2.y never resolves to the 3.0.0-alpha line).
tauri-plugin-window-state = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde_json = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"
