name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variants:
        description: 'Candidate variants: enabled or cli (manual runs never publish)'
        default: enabled
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
      desktop: ${{ steps.plan.outputs.desktop }}
      server: ${{ steps.plan.outputs.server }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
      - id: plan
        run: node scripts/release/release.mjs preflight
        env:
          RELEASE_VARIANTS: ${{ inputs.variants || 'enabled' }}
  quality:
    needs: preflight
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      desktop: ${{ needs.preflight.outputs.desktop == 'true' }}
  build:
    name: build (${{ matrix.target }})
    needs: [preflight, quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build, extract and execute CLI and MCP
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/release/cli.mjs "$RELEASE_TARGET" dist/release
      - if: matrix.desktop
        run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Build DMG and verify the app and embedded tools
        if: matrix.desktop
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/release/desktop.mjs build "$RELEASE_TARGET" dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
  server:
    needs: [preflight, quality]
    if: needs.preflight.outputs.server == 'true'
    uses: ./.github/workflows/release-server.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
  assemble:
    needs: [preflight, quality, build, server]
    if: >-
      always() && needs.preflight.result == 'success' && needs.quality.result == 'success' &&
      needs.build.result == 'success' && (needs.server.result == 'success' || needs.preflight.outputs.server == 'false')
    runs-on: ubuntu-22.04
    outputs:
      manifest_hash: ${{ steps.manifest.outputs.manifest_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: payload-*
          path: dist/release
          merge-multiple: true
      - id: manifest
        env:
          RELEASE_SELECTED: ${{ needs.preflight.outputs.selected }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: node scripts/release/release.mjs assemble dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
  brew:
    needs: [preflight, assemble]
    if: needs.preflight.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate
          path: dist/release
      - name: Fetch verified previous stable release for upgrade tests
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release/previous.mjs "$RELEASE_VERSION" "$RUNNER_TEMP/previous-shards"
      - name: Test generated tap against these candidate bytes
        id: brew-test
        env:
          SHARDS_BREW_SMOKE_DISPOSABLE: '1'
          RELEASE_TARGET: ${{ matrix.target }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          PREVIOUS_DIST: ${{ steps.previous.outputs.directory }}
        run: |
          if [ -n "$PREVIOUS_DIST" ]; then
            node scripts/release/brew-smoke.mjs dist/release "$RELEASE_TARGET" --previous "$PREVIOUS_DIST"
          else
            node scripts/release/brew-smoke.mjs dist/release "$RELEASE_TARGET"
          fi
  publish:
    needs: [preflight, quality, build, assemble, brew]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.quality.result == 'success' && needs.build.result == 'success' &&
      needs.assemble.result == 'success' && needs.brew.result == 'success'
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      candidate-run-id: ${{ github.run_id }}
      source-sha: ${{ needs.preflight.outputs.sha }}
      manifest-hash: ${{ needs.assemble.outputs.manifest_hash }}
      checks: ${{ toJSON(needs) }}
    secrets:
      tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
