name: Server release integration
on:
  workflow_call:
    inputs:
      ref: {required: true, type: string}
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - name: Require the real server package and its runtime acceptance contract
        run: node scripts/release/server.mjs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy -p shards-server --all-targets --locked -- -D warnings
      - run: cargo test -p shards-server --locked
      - run: cargo build -p shards-server --bin shards-server --release --locked
      - name: Verify native runtime, auth, persistence and shutdown
        run: bash crates/shards-server/scripts/release-smoke.sh native target/release/shards-server
      - name: Build and verify OCI image without publishing
        run: |
          docker build -f packaging/server/Dockerfile --tag shards-server:candidate .
          bash crates/shards-server/scripts/release-smoke.sh image shards-server:candidate
      - name: Package verified server outputs
        run: node scripts/release/server.mjs package dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: payload-server
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
